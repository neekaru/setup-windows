name: Validate PowerShell Scripts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | Where-Object { $_.FullName -notlike "*\examples\*" }
          if ($files) {
            $hasErrors = $false
            foreach ($file in $files) {
              Write-Host "Analyzing: $($file.FullName)"
              $results = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Warning,Error
              if ($results) {
                $results | Format-Table -AutoSize
                $hasErrors = $true
              }
            }
            if ($hasErrors) {
              exit 1
            }
          }